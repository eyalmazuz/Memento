[package]
name = "memento"
version = "2.0.2"
edition = "2021"
publish = false
default-run = "memento"

[features]
default = ["software-renderer", "accessibility"]
software-renderer = ["slint/renderer-software"]
accessibility = ["slint/accessibility"]
asr = ["asr-whisper"]
asr-whisper = ["dep:memento-asr-whisper"]
asr-onnx = ["dep:memento-asr-onnx"]
ocr = ["dep:libloading"]
whisper-cuda = ["asr-whisper", "memento-asr-whisper/cuda"]
whisper-vulkan = ["asr-whisper", "memento-asr-whisper/vulkan"]

[dependencies]
slint = { version = "=1.16.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    "backend-winit-x11",
    "raw-window-handle-06",
    "renderer-femtovg",
    "unstable-fontique-08",
    "unstable-winit-030",
] }
raw-window-handle = "=0.6.2"
libloading = { version = "=0.8.9", optional = true }
libc = "=0.2.190"
tempfile = "=3.27.0"
glow = "=0.17.0"
log = "=0.4.34"
serde_json = "=1.0.154"
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
copypasta = "=0.10.2"
parley = "=0.8.0"
swash = "=0.2.10"
resvg = { version = "=0.47.0", default-features = false, features = ["text", "raster-images"] }
webbrowser = "=1.2.4"

memento-config = { path = "crates/memento-config" }
memento-setting = { path = "crates/memento-setting" }
memento-player = { path = "crates/memento-player" }
memento-subtitle = { path = "crates/memento-subtitle" }
memento-ass = { path = "crates/memento-ass" }
memento-dict = { path = "crates/memento-dict" }
memento-definition = { path = "crates/memento-definition" }
memento-anki = { path = "crates/memento-anki" }
memento-net = { path = "crates/memento-net" }
memento-audio = { path = "crates/memento-audio" }
memento-util = { path = "crates/memento-util" }
memento-os = { path = "crates/memento-os" }
memento-asr = { path = "crates/memento-asr" }
memento-asr-onnx = { path = "crates/memento-asr-onnx", optional = true }
memento-asr-whisper = { path = "crates/memento-asr-whisper", optional = true }

[dev-dependencies]
base64 = "=0.22.1"
libloading = "=0.8.9"
i-slint-backend-testing = "=1.16.1"
i-slint-renderer-femtovg = { version = "=1.16.1", features = ["opengl"] }

[build-dependencies]
slint-build = "=1.16.1"

[lib]
name = "memento_app"
path = "src/lib.rs"

[[bin]]
name = "memento"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "crates/*",
]

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
debug-assertions = false
overflow-checks = false

# Distribution release profile: inherits size/speed tuning and per-package
# overrides from `release` while upgrading to fat LTO for maximum cross-crate
# inlining and dead-code elimination. Keep unwinding enabled (`catch_unwind` is
# relied upon across FFI/clipboard/testing boundaries).
[profile.release-dist]
inherits = "release"
lto = "fat"

# Keep hot rendering, text shaping, dictionary search, ASS, and ASR DSP crates at -O3
# while cold UI glue and generated Slint code optimize for binary size (`opt-level = "s"`).
[profile.release.package.swash]
opt-level = 3

[profile.release.package.parley]
opt-level = 3

[profile.release.package."tiny-skia@0.12.0"]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.femtovg]
opt-level = 3

[profile.release.package.memento-dict]
opt-level = 3

[profile.release.package.memento-definition]
opt-level = 3

[profile.release.package.memento-ass]
opt-level = 3

[profile.release.package.memento-asr]
opt-level = 3

[profile.release.package.memento-asr-onnx]
opt-level = 3

[profile.release.package.memento-asr-whisper]
opt-level = 3

# `cargo run` is also used for playback. Keep debug symbols/assertions while
# optimizing the UI libraries' per-frame work.
[profile.dev.package.i-slint-core]
opt-level = 2

[profile.dev.package.i-slint-renderer-femtovg]
opt-level = 2

[profile.dev.package.femtovg]
opt-level = 2

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

# Shaping and rasterizing a new popup also calls into these font libraries.
# Optimizing only Slint/Swash leaves their font parsing/hinting in debug mode.
[profile.dev.package.fontique]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package."read-fonts"]
opt-level = 2
