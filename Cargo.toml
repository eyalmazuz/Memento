[package]
name = "subomi"
version.workspace = true
edition = "2021"
publish = false
default-run = "subomi"

[features]
default = ["software-renderer", "accessibility"]
software-renderer = ["slint/renderer-software"]
accessibility = ["slint/accessibility"]
asr = ["asr-whisper"]
asr-whisper = ["dep:subomi-asr-whisper"]
asr-onnx = ["dep:subomi-asr-onnx"]
ocr = []
whisper-cuda = ["asr-whisper", "subomi-asr-whisper/cuda"]
whisper-vulkan = ["asr-whisper", "subomi-asr-whisper/vulkan"]

[dependencies]
slint = { version = "=1.16.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    "backend-winit-x11",
    "raw-window-handle-06",
    "renderer-femtovg",
    "unstable-fontique-08",
    "unstable-winit-030",
] }
raw-window-handle = "=0.6.2"
libc = "=0.2.190"
tempfile = "=3.27.0"
glow = "=0.17.0"
log = "=0.4.34"
serde_json = "=1.0.154"
url = "=2.5.8"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
copypasta = "=0.10.2"
parley = "=0.8.0"
swash = "=0.2.10"
resvg = { version = "=0.47.0", default-features = false, features = ["text", "raster-images"] }
webbrowser = "=1.2.4"

subomi-config = { path = "crates/subomi-config" }
subomi-setting = { path = "crates/subomi-setting" }
subomi-player = { path = "crates/subomi-player" }
subomi-subtitle = { path = "crates/subomi-subtitle" }
subomi-ass = { path = "crates/subomi-ass" }
subomi-dict = { path = "crates/subomi-dict" }
subomi-definition = { path = "crates/subomi-definition" }
subomi-anki = { path = "crates/subomi-anki" }
subomi-net = { path = "crates/subomi-net" }
subomi-audio = { path = "crates/subomi-audio" }
subomi-util = { path = "crates/subomi-util" }
subomi-os = { path = "crates/subomi-os" }
subomi-ui = { path = "crates/subomi-ui" }
subomi-asr = { path = "crates/subomi-asr" }
subomi-asr-onnx = { path = "crates/subomi-asr-onnx", optional = true }
subomi-asr-whisper = { path = "crates/subomi-asr-whisper", optional = true }

[dev-dependencies]
base64 = "=0.22.1"
libloading = "=0.8.9"
i-slint-backend-testing = "=1.16.1"
i-slint-renderer-femtovg = { version = "=1.16.1", features = ["opengl"] }

[lib]
name = "subomi_app"
path = "src/lib.rs"

[[bin]]
name = "subomi"
path = "src/main.rs"

[workspace]
resolver = "2"
members = [
    ".",
    "crates/*",
]

[workspace.package]
version = "3.0.0"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 16
strip = "symbols"
debug-assertions = false
overflow-checks = false

# Distribution release profile: inherits size/speed tuning and per-package
# overrides from `release` while upgrading to fat LTO + single codegen unit
# for maximum cross-crate inlining and dead-code elimination. Keep unwinding
# enabled (`catch_unwind` is relied upon across FFI/clipboard/testing boundaries).
[profile.release-dist]
inherits = "release"
lto = "fat"
codegen-units = 1

# Keep hot rendering, text shaping, dictionary search, ASS, and ASR DSP crates at -O3
# while cold UI glue and generated Slint code optimize for binary size (`opt-level = "z"`).
[profile.release.package.swash]
opt-level = 3

[profile.release.package.parley]
opt-level = 3

[profile.release.package."tiny-skia@0.12.0"]
opt-level = 3

[profile.release.package.resvg]
opt-level = 3

[profile.release.package.harfrust]
opt-level = 3

[profile.release.package.femtovg]
opt-level = 3

[profile.release.package.subomi-dict]
opt-level = 3

[profile.release.package.subomi-definition]
opt-level = 3

[profile.release.package.subomi-ass]
opt-level = 3

[profile.release.package.subomi-subtitle]
opt-level = 3

[profile.release.package.subomi-asr]
opt-level = 3

[profile.release.package.subomi-asr-onnx]
opt-level = 3

[profile.release.package.subomi-asr-whisper]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package."png@0.18.1"]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.image-webp]
opt-level = 3

# Keep full file:line panic backtraces in dev/test while eliminating ~750 MB of
# full-variable DWARF bloat per binary (especially across generated Slint UI).
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.subomi-ui]
debug = 0

# `cargo run` is also used for playback. Keep debug symbols/assertions while
# optimizing the UI libraries' per-frame work.
[profile.dev.package.i-slint-core]
opt-level = 2

[profile.dev.package.i-slint-renderer-femtovg]
opt-level = 2

[profile.dev.package.femtovg]
opt-level = 2

[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2

# Shaping and rasterizing a new popup also calls into these font libraries.
# Optimizing only Slint/Swash leaves their font parsing/hinting in debug mode.
[profile.dev.package.fontique]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package."read-fonts"]
opt-level = 2

# Optimize screenshot resizing and PNG/JPEG/WebP encoding during Anki card mining.
[profile.dev.package.image]
opt-level = 2

[profile.dev.package."png@0.18.1"]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.image-webp]
opt-level = 2
