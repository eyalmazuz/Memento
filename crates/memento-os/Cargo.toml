[package]
name = "memento-os"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "Rust screensaver inhibition backend for Memento"
license = "GPL-2.0-only"

[dependencies]
zbus = "=4.4.0"
zbus_xml = "=4.0.0"

[lib]
name = "memento_os"
path = "src/lib.rs"
crate-type = ["staticlib", "lib"]
