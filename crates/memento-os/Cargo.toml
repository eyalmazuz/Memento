[package]
name = "memento-os"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "Rust screensaver inhibition backend for Memento"
license = "GPL-2.0-only"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lib]
name = "memento_os"
path = "src/lib.rs"
crate-type = ["lib"]
