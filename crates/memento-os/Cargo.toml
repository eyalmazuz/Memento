[package]
name = "memento-os"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "Cross-platform OS integration for Memento (screensaver, dialogs, system theme, macOS PATH, Windows fullscreen)"
license = "GPL-2.0-only"

# Note: Windows (`IFileOpenDialog` COM) and macOS (`NSOpenPanel` AppKit) native
# file/folder pickers are implemented directly via zero-dependency OS FFI in
# `src/native_dialogs.rs` so offline/locked builds do not require `rfd`.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lib]
name = "memento_os"
path = "src/lib.rs"
crate-type = ["lib"]
