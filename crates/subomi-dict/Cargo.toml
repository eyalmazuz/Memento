[package]
name = "subomi-dict"
version = "2.0.2"
edition = "2021"
rust-version = "1.89"
description = "Yomitan dictionary importer, SQLite query engine, and Japanese deconjugator"
license = "GPL-2.0-only"

[dependencies]
rusqlite = { version = "0.43", default-features = false, features = ["cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
unicode-normalization = "=0.1.25"
regex = "=1.13.1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[lib]
name = "subomi_dict"
path = "src/lib.rs"
crate-type = ["lib"]
