[package]
name = "subomi-os"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "Cross-platform OS integration (screensaver, native dialogs, system theme, fullscreen)"
license = "GPL-2.0-only"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.18", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[lib]
name = "subomi_os"
path = "src/lib.rs"
crate-type = ["lib"]
