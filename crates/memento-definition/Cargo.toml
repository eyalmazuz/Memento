[package]
name = "memento-definition"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "Rust port of the Memento structured-content CSS engine (src/definition/structuredrichtext_css.cpp)"
license = "GPL-2.0-only"

[dependencies]
unicode-general-category = "1.1"

[lib]
name = "memento_definition"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]
