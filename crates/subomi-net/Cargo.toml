[package]
name = "subomi-net"
version.workspace = true
edition = "2021"
rust-version = "1.85"
description = "HTTP client, AnkiConnect transport, and model downloader"
license = "GPL-2.0-only"

[dependencies]
serde_json = "=1.0.154"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
url = "=2.5.8"
# Workspace-internal, std-only siblings reused per the port plan (these are not
# external crates.io dependencies):
# - subomi-anki: the already-ported AnkiConnect reply-shape validation core
#   (ReplyValidation / TypedReplyStatus / check_ankiconnect_version).
# - subomi-setting: the DownloadManager progress/speed helpers
#   (download_speed & download_progress_update bounce for subomi-net::download).
subomi-anki = { path = "../subomi-anki" }
subomi-setting = { path = "../subomi-setting" }

[lib]
name = "subomi_net"
path = "src/lib.rs"
crate-type = ["rlib"]
