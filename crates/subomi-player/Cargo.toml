[package]
name = "subomi-player"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "libmpv playback controller and command bridge"
license = "GPL-2.0-only"
build = "build.rs"

[build-dependencies]
bindgen = "0.73"
pkg-config = "0.3"

[lib]
name = "subomi_player"
path = "src/lib.rs"
crate-type = ["lib"]
