[package]
name = "subomi-asr"
version.workspace = true
edition = "2021"
rust-version = "1.77"
description = "Real-time speech recognition pipeline, audio frontend, and ONNX tokenizer"
license = "GPL-2.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[lib]
name = "subomi_asr"
path = "src/lib.rs"
crate-type = ["lib"]
