[package]
name = "memento-asr-engines"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "Facade staticlib embedding the Memento ASR engine crates exactly once"
license = "GPL-2.0-only"

[dependencies]
memento-asr = { path = "../memento-asr" }
memento-asr-onnx = { path = "../memento-asr-onnx" }
memento-asr-whisper = { path = "../memento-asr-whisper" }

[lib]
name = "memento_asr_engines"
crate-type = ["staticlib"]
