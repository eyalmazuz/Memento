[package]
name = "memento-ass"
version = "2.0.2"
edition = "2021"
rust-version = "1.77"
description = "libass layout/hitbox probing, highlight-patch rendering, and Matroska EBML extraction for Memento"
license = "GPL-2.0-only"
build = "build.rs"

[dependencies]
flate2 = "1.1"
libc = "=0.2.190"

[dev-dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
cc = "1"
pkg-config = "0.3"
