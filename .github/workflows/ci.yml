name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'example.png'
      - 'docs/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'example.png'
      - 'docs/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends \
            build-essential \
            libclang-dev \
            pkg-config \
            libmpv-dev \
            libass-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libfontconfig1-dev \
            libegl1-mesa-dev \
            fontconfig \
            fonts-noto-cjk \
            fonts-noto-color-emoji \
            mecab \
            libmecab2 \
            mecab-ipadic-utf8
          fc-cache -f

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-linux-${{ matrix.arch }}

      - name: Run workspace tests (base)
        run: cargo test --workspace --exclude subomi-asr-whisper --exclude subomi-asr-onnx

  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install Homebrew dependencies
        run: |
          brew install pkgconf mpv libass

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-macos-${{ matrix.arch }}

      - name: Run workspace tests (base)
        run: |
          export MPV_SDK="$(brew --prefix mpv)"
          export ASS_SDK="$(brew --prefix libass)"
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:$(brew --prefix libarchive)/lib/pkgconfig"
          cargo test --workspace --exclude subomi-asr-whisper --exclude subomi-asr-onnx

  windows:
    name: Windows (x86_64 MSVC)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Restore vcpkg installed libraries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libass-win-x64-v1

      - name: Setup Windows native dependencies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/scripts/setup-windows-deps.ps1

      - name: Save vcpkg installed libraries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-libass-win-x64-v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-windows-x86_64

      - name: Build and test workspace (base)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $PSNativeCommandUseErrorActionPreference = $false
          $buildLog = "windows-ci-build.log"
          cargo test --workspace --exclude subomi-asr-whisper --exclude subomi-asr-onnx 2>&1 | Tee-Object -FilePath $buildLog
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            if (Select-String -Path $buildLog -Pattern 'LNK\d{4}|unresolved external symbol|cannot open input file' -Quiet) {
              Write-Warning "Build/test with static libass failed at link; retrying with dynamic libass fallback..."
              $ErrorActionPreference = "Stop"
              ./.github/scripts/setup-windows-deps.ps1 -DynamicLibAss
              $ErrorActionPreference = "Continue"
              cargo test --workspace --exclude subomi-asr-whisper --exclude subomi-asr-onnx
              exit $LASTEXITCODE
            }
            exit $exitCode
          }
